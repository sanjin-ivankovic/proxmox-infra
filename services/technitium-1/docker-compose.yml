---
# Technitium DNS Server (technitium-1)
# Primary authoritative and recursive DNS server
#
# Deployment: Auto-deployed via GitLab CI/CD on push to main
# Web UI: http://<host-ip>:5380
# DNS Port: 53 (TCP/UDP)

services:
  technitium-1:
    container_name: technitium-1
    hostname: technitium-1
    image: technitium/dns-server:15.4.0@sha256:df7d90ef0f7b6fff6916d291a7022cd902290cc31c3141d4158b6c375a641b41
    network_mode: host
    environment:
      TZ: ${TZ}
      DNS_SERVER_DOMAIN: ${DNS_SERVER_DOMAIN}
      DNS_SERVER_ADMIN_PASSWORD: ${DNS_SERVER_ADMIN_PASSWORD}
      DNS_SERVER_PREFER_IPV6: "false"
      DNS_SERVER_LOG_USING_LOCAL_TIME: "true"
    volumes:
      - ${APPDATA_DIR}/technitium-1/config:/etc/dns
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dig", "@127.0.0.1", "localhost", "+time=2", "+tries=1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
