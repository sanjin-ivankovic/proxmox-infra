; pihole-updatelists config for both Pi-hole nodes, mounted read-only.
; Booleans must live here: the script casts env values with (bool), so
; REQUIRE_COMMENT=false in the environment reads as true.
;
; Every source is a file under lists/. BLOCKLISTS_URL names a file of adlist
; URLs; the other two name files of entries.
BLOCKLISTS_URL="/lists/blocklists.txt"
WHITELIST_URL="/lists/allowlist.txt"
REGEX_BLACKLIST_URL="/lists/regex-deny.txt"

; Own every entry, not only the ones carrying this script's comment, so the
; default adlist and anything added in the UI are removed on the next run.
REQUIRE_COMMENT=false
