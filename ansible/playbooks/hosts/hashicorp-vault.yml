---
# HashiCorp Vault host — TLS certificate and appdata for services/vault.

- name: HashiCorp Vault host
  hosts: "{{ target | default('vault') }}"
  become: true
  gather_facts: false
  remote_user: maintainer
  vars:
    ansible_user: maintainer
  tags: [hashicorp-vault]

  roles:
    - role: hashicorp_vault
