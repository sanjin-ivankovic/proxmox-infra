---
# ============================================================================
# Talos Cluster - Global Variables
# ============================================================================

# ==============================================================================
# Cluster Information
# ==============================================================================

cluster_name: "example"
cluster_domain: "example.com"

# ==============================================================================
# Kubernetes Version
# ==============================================================================

# Keep this equal to the LIVE cluster version (kubectl version). In-place
# upgrades (make upgrade-k8s) move the cluster without touching this file, and
# a stale value makes `talosctl apply-config` from regenerated configs
# DOWNGRADE the control plane. Always `talosctl apply-config --dry-run` first.
kubernetes_version: "v1.37.1"

# ==============================================================================
# Talos Versions
# ==============================================================================

talos_version: "v1.14.6"

# Machine-config contract for `talosctl gen config --talos-version`. v1.14
# emits the multi-document format (KubeletConfig, KubeAPIServerConfig, ...)
# and adds defaults for new clusters; the patches in talos/patches/ are
# written for it and remove the defaults this cluster does not run.
talos_config_contract: "v1.14"

# Image Factory schematic (platform metal): siderolabs/iscsi-tools (Longhorn)
# and siderolabs/qemu-guest-agent (Proxmox). The installer tag follows
# talos_version, so `-e talos_version=...` upgrades install the matching image.
talos_schematic_id: "dc7b152cb3ea99b821fcb7340ce7168313ce393d663740b791c36f6e95fc8586"
talos_installer_image: "factory.talos.dev/installer/{{ talos_schematic_id }}:{{ talos_version }}"

# ==============================================================================
# Network Configuration
# ==============================================================================

# Control plane endpoint (Layer 2 VIP for HA)
# VIP is configured via machine patches and announced from one CP at a time
talos_control_plane_endpoint: "https://10.140.0.40:6443"
talos_vip_address: "10.140.0.40"

# Endpoint for `talosctl upgrade` in 07-upgrade-talos.yml. MUST be a control
# plane node (the upgrade's internal k8s drain fetches kubeconfig via the
# endpoint, which only control-plane nodes serve). Using the CP VIP keeps it
# valid even while individual CP nodes reboot during the rolling upgrade.
talos_upgrade_endpoint: "{{ talos_vip_address }}"

# Network CIDR ranges
pod_network_cidr: "10.244.0.0/16"
service_network_cidr: "10.96.0.0/12"

# DNS Configuration
# Nameservers used by Talos nodes (homelab DNS servers)
talos_nameservers:
  - "10.110.0.12"
  - "10.110.0.13"

# Time Configuration
# NTP servers used by Talos nodes
talos_time_servers:
  - "time.cloudflare.com"

# ==============================================================================
# Machine Configuration
# ==============================================================================

# Install disk for Talos OS
talos_install_disk: "/dev/sda"

# ==============================================================================
# Proxmox Configuration (for VM lifecycle operations)
# ==============================================================================

# By address: the startup runs right after a Proxmox host reboot, while the
# DNS servers (LXCs on that host) may still be starting. Certificates are
# not validated (validate_certs: false), so the name buys nothing here.
proxmox_api_host: "10.105.0.4"
proxmox_api_port: 8006
proxmox_node: "pve"
# Credentials: kv/proxmox-infra/talos proxmox_api_user, proxmox_api_token_id,
# proxmox_api_token_secret (secrets.yml).

# ==============================================================================
# Docker Hub Authentication (for containerd registry auth on all nodes)
# ==============================================================================
# Credentials: kv/proxmox-infra/talos dockerhub_username, dockerhub_password
# (secrets.yml).

# ==============================================================================
# Infrastructure Components (Deployed via ArgoCD GitOps)
# ==============================================================================
# These components are deployed via ArgoCD from the argo-apps repository.
# Variables here are for documentation/reference only.
#
# Deployment method: GitOps via ArgoCD
# Repository: ssh://git@source.example.com/example-org/argo-apps.git
# Location: argo-apps/infrastructure/
#
# To deploy infrastructure:
#   1. Bootstrap Talos cluster (ansible)
#   2. Deploy ArgoCD via bootstrap manifest
#   3. ArgoCD syncs infrastructure from argo-apps repo
# ==============================================================================

# ArgoCD Configuration (Bootstrap Application)
argocd_git_repo: "ssh://git@source.example.com/example-org/argo-apps.git"
argocd_bootstrap_manifest: "https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml"

# Infrastructure Components Reference (Deployed via GitOps)
# These are NOT deployed by Ansible - they're managed by ArgoCD
infrastructure_components:
  longhorn:
    version: "v1.7.2"
    deployed_via: "argo-apps/apps/infra/longhorn/"
    description: "Distributed block storage for Kubernetes"

  traefik:
    version: "v3.3.5"
    deployed_via: "argo-apps/apps/infra/traefik/"
    description: "Kubernetes Ingress Controller"

  cert_manager:
    version: "v1.16.2"
    deployed_via: "argo-apps/apps/infra/cert-manager/"
    description: "TLS certificate management"

  metallb:
    version: "v0.14.9"
    deployed_via: "argo-apps/apps/infra/metallb/"
    description: "Bare metal load balancer"
