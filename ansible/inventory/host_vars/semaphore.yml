---
# ansible/inventory/host_vars/semaphore.yml
# Host config and Komodo Periphery secrets for semaphore. Secrets come from
# kv/proxmox-infra/semaphore (group_vars/all/secrets.yml), except the two
# Semaphore needs before it can read Vault, which stay in the Ansible vault.

# semaphore is an older LXC still on Debian 12 (bookworm). The common_system
# role defaults to Debian 13+; allow 12 just here so plays run. Upgrade the
# container's OS to 13 to drop this override.
common_system_debian_version_min: 12

# Nightly Talos etcd snapshots (configs/semaphore.yml TALOS_ETCD_BACKUP_DIR,
# mounted from appdata); monitoring_agent reports the newest one's age.
monitoring_agent_etcd_backup_dir: /srv/docker/appdata/semaphore/data/etcd-backups

komodo_periphery_secrets:
  SEMAPHORE_ADMIN_PASSWORD: "{{ kv_semaphore.admin_password }}"
  # SEMAPHORE_ADMIN / _NAME / _EMAIL are non-secret -> komodo/stacks.toml.

  # Credentials for running this repo's playbooks: the Ansible vault password
  # (bootstrap tier) and the SecretID of the `semaphore` AppRole, which
  # Semaphore forwards to every run (services/semaphore, configs/semaphore.yml).
  SEMAPHORE_ANSIBLE_VAULT_PASSWORD: "{{ vault_semaphore_ansible_vault_password }}"
  SEMAPHORE_VAULT_SECRET_ID: "{{ vault_semaphore_vault_secret_id }}"
  SEMAPHORE_PVE_API_TOKEN_ID: "{{ kv_semaphore.pve_api_token_id }}"
  SEMAPHORE_PVE_API_TOKEN_SECRET: "{{ kv_semaphore.pve_api_token_secret }}"

  # Authentik OIDC client secret for the `semaphore` client. Authentik reads
  # it from Vault kv/k8s/authentik/authentik-oidc-clients
  # (SEMAPHORE_CLIENT_SECRET); this is a copy, so a rotation must update both.
  SEMAPHORE_OIDC_CLIENT_SECRET: "{{ kv_semaphore.oidc_client_secret }}"
