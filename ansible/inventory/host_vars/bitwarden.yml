---
# ansible/inventory/host_vars/bitwarden.yml
# Komodo Periphery secrets for bitwarden, from kv/proxmox-infra/bitwarden
# (group_vars/all/secrets.yml), rendered into the host's periphery.config.toml
# by `make -C ansible periphery-secrets HOST=bitwarden`. Stacks reference them as
# [[NAME]].

komodo_periphery_secrets:
  BW_DB_PASSWORD: "{{ kv_bitwarden.db_password }}"
  BW_INSTALLATION_ID: "{{ kv_bitwarden.installation_id }}"
  BW_INSTALLATION_KEY: "{{ kv_bitwarden.installation_key }}"
  # Cloudflare R2 offsite backup credentials.
  BACKUP_R2_ACCESS_KEY: "{{ kv_bitwarden.r2_access_key_id }}"
  BACKUP_R2_SECRET_KEY: "{{ kv_bitwarden.r2_secret_access_key }}"
  # NOTE: BW_SMTP_PASSWORD is empty in the current env (local smtp4dev capture),
  # so it is not a secret here. Add it if real SMTP creds are introduced.
