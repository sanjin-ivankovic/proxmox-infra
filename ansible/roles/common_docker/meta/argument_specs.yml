---
# Argument specification for the common_docker role.
# Defaults here MUST match defaults/main.yml.
argument_specs:
  main:
    short_description: Install and configure Docker CE on Debian/Ubuntu
    description:
      - Installs Docker CE and the compose plugin from the official repository,
        configures the daemon, sets up the on-host directory layout, adds the
        admin user to the docker group, and verifies the install.
      - The directory owner is taken from the playbook-level C(user) variable.
    author:
      - Maintainer Name
    options:
      common_docker_dir:
        type: path
        required: false
        default: /srv/docker
        description: Base directory for Docker service data.
      common_docker_backup_dir:
        type: path
        required: false
        default: /srv/docker-backups
        description: Directory for Docker service backups.
      common_docker_create_readme:
        type: bool
        required: false
        default: true
        description: Whether to write a README documenting the directory layout.
      common_docker_test_run:
        type: bool
        required: false
        default: false
        description: Whether to run a hello-world container as a smoke test.
      common_docker_restart_containers_on_start:
        type: list
        elements: str
        required: false
        default: []
        description:
          - Container names to C(docker restart) via a systemd ExecStartPost
            drop-in whenever dockerd (re)starts. For Docker-out-of-Docker
            containers that bind-mount the daemon socket file (e.g. the GitLab
            runner), which otherwise stay pinned to the pre-upgrade socket
            inode. Empty writes no drop-in.
      common_docker_prune_enabled:
        type: bool
        required: false
        default: false
        description:
          - Install a systemd timer that prunes unused images, build cache and
            labelled volumes. Disabled removes the timer and service.
      common_docker_prune_schedule:
        type: str
        required: false
        default: 'Sun *-*-* 06:00:00'
        description: systemd OnCalendar expression for the prune timer.
      common_docker_prune_until:
        type: str
        required: false
        default: '168h'
        description:
          - Only images and build cache older than this are pruned (docker
            C(until) filter).
      common_docker_prune_volume_label:
        type: str
        required: false
        default: ''
        description:
          - Unattached volumes with this label (C(key=value)) are pruned. Empty
            leaves every volume alone.
      common_docker_distribution_release:
        type: str
        required: false
        default: "{{ ansible_facts['distribution_release'] }}"
        description:
          - APT distribution release used for the Docker repo. Defaults to the
            detected release; override only if auto-detection fails.
      common_docker_repo_url:
        type: str
        required: false
        default: "https://download.docker.com/linux/{{ 'ubuntu' if ansible_facts['distribution'] == 'Ubuntu' else 'debian' }}"
        description:
          - Base URL of the Docker APT repository. Defaults based on the detected
            distribution.
