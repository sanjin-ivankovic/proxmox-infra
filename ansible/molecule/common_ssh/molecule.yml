---
# Molecule scenario for the common_ssh role.
# Driver: docker (matches the Debian-LXC fleet). The image runs systemd so the
# role's "restart ssh" handler and `sshd -t` validation exercise realistically.
#
# Run from ansible/ (make molecule-scenario S=<role>):
#   molecule test -s <role>
driver:
  name: docker

platforms:
  - name: common-ssh-debian13
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    cgroupns_mode: host
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  # Roles resolve by bare name from the repo's roles/ dir.
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
  playbooks:
    converge: converge.yml
    verify: verify.yml

# This scenario defines only converge + verify playbooks, so declare the
# sequence we actually run (the default also tries dependency/prepare/
# side_effect/cleanup, which we don't have).
scenario:
  test_sequence:
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
