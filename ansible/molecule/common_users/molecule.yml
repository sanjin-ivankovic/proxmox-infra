---
# Molecule scenario for the common_users role.
# Driver: docker, systemd-enabled Debian image (matches the LXC fleet).
#
# Run from ansible/ (make molecule-scenario S=<role>):
#   molecule test -s <role>
driver:
  name: docker

platforms:
  - name: common-users-debian13
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    cgroupns_mode: host
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  # Roles resolve by bare name from the repo's roles/ dir.
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
  playbooks:
    converge: converge.yml
    verify: verify.yml

# Only converge + verify are defined; declare the sequence we actually run.
scenario:
  test_sequence:
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
