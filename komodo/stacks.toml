APPDATA_DIR = [[APPDATA_DIR]]
TZ = [[TZ]]
SEMAPHORE_ADMIN = admin
SEMAPHORE_ADMIN_NAME = Admin
SEMAPHORE_ADMIN_EMAIL = admin@example.com
SEMAPHORE_ADMIN_PASSWORD = [[SEMAPHORE_ADMIN_PASSWORD]]
SEMAPHORE_ANSIBLE_VAULT_PASSWORD = [[SEMAPHORE_ANSIBLE_VAULT_PASSWORD]]
SEMAPHORE_VAULT_SECRET_ID = [[SEMAPHORE_VAULT_SECRET_ID]]
SEMAPHORE_PVE_API_URL = https://10.105.0.4:8006/api2/json
SEMAPHORE_PVE_API_TOKEN_ID = [[SEMAPHORE_PVE_API_TOKEN_ID]]
SEMAPHORE_PVE_API_TOKEN_SECRET = [[SEMAPHORE_PVE_API_TOKEN_SECRET]]
SEMAPHORE_OIDC_CLIENT_SECRET = [[SEMAPHORE_OIDC_CLIENT_SECRET]]
"""

# ----------------------------------------------------------------------------
# HashiCorp Vault (secret store)
# ----------------------------------------------------------------------------
# Every container restart seals Vault until it is unsealed by hand
# (docs/VAULT.md). manual-deploy (checked by scripts/komodo_lint.py): no wave
# tag and deploy = false, so GitOps Apply never redeploys it, and its
# config_files change does not restart it. Deploy by hand with
# `make komodo-deploy STACK=vault`, then unseal.
[[stack]]
name = "vault"
tags = ["iac", "secrets", "manual-deploy"]
deploy = false
[stack.config]
server = "vault"
linked_repo = "proxmox-infra"
file_paths = ["services/vault/docker-compose.yml"]
config_files = [
  { path = "services/vault/vault.hcl", services = ["vault"], requires = "None" },
]
environment = """
APPDATA_DIR = [[APPDATA_DIR]]
TZ = [[TZ]]
"""
