# ----------------------------------------------------------------------------
# Semaphore (Ansible UI)
# ----------------------------------------------------------------------------
[[stack]]
name = "semaphore"
tags = ["iac", "wave-1", "ansible"]
deploy = true
[stack.config]
server = "semaphore"
linked_repo = "proxmox-infra"
file_paths = ["services/semaphore/docker-compose.yml"]
config_files = [
  { path = "services/semaphore/known_hosts", services = ["semaphore"], requires = "Restart" },
]
